name: hand_made
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.1

dependencies:
  flutter:
    sdk: flutter

  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  intl: ^0.20.2

  # Firebase
  firebase_core: ^4.11.0
  firebase_auth: ^6.5.4

  # State Management
  flutter_bloc: ^9.1.1

  # Navigation
  go_router: ^17.3.0

  # Networking
  dio: ^5.10.0

  # Functional Programming
  dartz: ^0.10.1

  # Local Storage
  shared_preferences: ^2.5.5
  flutter_secure_storage: ^10.3.1
  sqflite: ^2.4.2+1

  # UI
  flutter_screenutil: ^5.9.3
  cached_network_image: ^3.4.1
  smooth_page_indicator: ^2.0.1
  shimmer: ^3.0.0
  readmore: ^3.0.0
  fluttertoast: ^9.1.0
  persistent_bottom_nav_bar: ^6.2.1
  font_awesome_flutter: ^11.0.0
  pinput: ^6.0.2
  retrofit: ^4.9.2
  json_annotation: ^4.9.0


  # Development
  device_preview: ^1.3.1
  bloc: ^9.2.1
  freezed: ^3.2.3
  freezed_annotation: ^3.1.0
  build_runner: ^2.7.2
  pubspec_generator: ^5.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_native_splash: ^2.4.6

  # Code Generation
  retrofit_generator: ^10.2.8
  pubspec_dependency_sorter: ^1.0.5
  assets_generator: ^4.0.4+1

flutter_native_splash:
  color: "#A45D36"
  image: assets/images/logo.png
  android: true
  ios: true

flutter:
  generate: true
  uses-material-design: true

  assets:
    - assets/images/
    - assets/images/splash/
    - assets/images/onboarding/

  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
          weight: 400
        - asset: assets/fonts/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700

flutter_assets:
  assets_path: assets/
  output_path: lib/core/constants/
  filename: assets.dart
  field_prefix: null
flutter_intl:
  enabled: true
